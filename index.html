dre=document.getElementById('cadre'),attente=document.getElementById('attente');let delai=null,quitte=null;
function attendre(texte,ms){attente.textContent=texte;attente.hidden=false;clearTimeout(delai);delai=setTimeout(pret,ms||15000);}function pret(){clearTimeout(delai);attente.hidden=true;ajuster();}function ouvrir(src,texte){attendre(texte);try{quitte=frame.contentDocument;}catch(_){quitte=null;}frame.src=src;}
const BORDS=['Top','Right','Bottom','Left'];function insets(w){const d=w.document;let p=d.getElementById('sonde');const temp=!p;if(temp){p=d.createElement('div');p.style.cssText='position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)';d.body.appendChild(p);}const c=w.getComputedStyle(p),r=BORDS.map(k=>parseFloat(c['padding'+k])||0);if(temp)p.remove();return r;}
function ajuster(){try{const d=frame.contentDocument;if(!d||!d.body)return;const a=insets(window),b=insets(frame.contentWindow),vue=['/france.html','/n4/index.html','/epr/index.html'].some(v=>frame.contentWindow.location.pathname.endsWith(v));BORDS.forEach((k,i)=>{const valeur=Math.max(a[i],b[i])+'px';cadre.style['padding'+k]='0px';d.documentElement.style.setProperty('--simurep-safe-'+k.toLowerCase(),valeur);if(!vue)d.documentElement.style['padding'+k]=valeur;});const fond=frame.contentWindow.getComputedStyle(d.body).backgroundColor;cadre.style.background=fond&&fond!=='rgba(0, 0, 0, 0)'?fond:'';}catch(e){}}
frame.addEventListener('load',()=>{if(frame.contentDocument!==quitte)quitte=null;ajuster();let vue=false;try{const chemin=frame.contentWindow.location.pathname;vue=['/france.html','/n4/index.html','/epr/index.html'].some(v=>chemin.endsWith(v));frame.contentWindow.addEventListener('pagehide',e=>{if(!e.persisted&&attente.hidden)attendre('Chargement de SIMUREP…');});}catch(_){}if(!attente.hidden){if(!vue)return pret();clearTimeout(delai);delai=setTimeout(pret,6000);}});window.addEventListener('pageshow',e=>{if(e.persisted)pret();});window.addEventListener('resize',ajuster);window.addEventListener('orientationchange',ajuster);if(window.visualViewport)visualViewport.addEventListener('resize',()=>{if(scrollX||scrollY)scrollTo(0,0);ajuster();});
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==frame.contentWindow||!e.data||(quitte&&frame.contentDocument===quitte))return;const d=e.data,poste=['N4','EPR'].includes(d.palier)?d.palier:null;if(d.type==='sdc-pret'||d.type==='sdc-routage-annule')return pret();if(d.type==='sdc-routage'&&poste)return attendre('Ouverture du poste '+poste+'…');if(d.type==='sdc-retour'){const site=String(d.site||'').slice(0,40),cnpe=d.vue==='cnpe'&&site;return ouvrir('france.html'+(cnpe?'#cnpe='+encodeURIComponent(site):''),cnpe?'Retour au CNPE…':'Retour à la carte de France…');}if(d.type==='sdc-private'&&poste)ouvrir(poste.toLowerCase()+'/index.html?site='+encodeURIComponent(d.site)+'&unit='+Number(d.unit),'Ouverture du poste '+poste+'…');});
attendre('Chargement de SIMUREP…');if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});</script></body></html>
